<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Netflix Red to Facebook Blue Gradient -->
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E50914" />
      <stop offset="50%" stop-color="#8B00FF" />
      <stop offset="100%" stop-color="#1877F2" />
    </linearGradient>

    <!-- Shield Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Metallic/Quantum Gradient -->
    <linearGradient id="metallic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A1D24" />
      <stop offset="50%" stop-color="#2D323E" />
      <stop offset="100%" stop-color="#0F1115" />
    </linearGradient>
  </defs>

  <!-- Dark Background Plate -->
  <rect width="800" height="800" rx="160" fill="#0A0B0E"/>

  <!-- Quantum Circuit Network Background Grid -->
  <g stroke="url(#brandGradient)" stroke-width="1.5" opacity="0.25" fill="none">
    <circle cx="400" cy="400" r="320" stroke-dasharray="8 8"/>
    <circle cx="400" cy="400" r="260" stroke-dasharray="12 6"/>
    <path d="M 100 400 L 700 400 M 400 100 L 400 700" />
    <path d="M 180 180 L 620 620 M 180 620 L 620 180" />
  </g>

  <!-- Outer Sentinel Shield Rim -->
  <path d="M 400 120 
           C 520 120, 640 160, 640 280 
           C 640 480, 500 620, 400 680 
           C 300 620, 160 480, 160 280 
           C 160 160, 280 120, 400 120 Z" 
        fill="url(#metallic)" 
        stroke="url(#brandGradient)" 
        stroke-width="12" 
        filter="url(#glow)"/>

  <!-- Inner Shield Core -->
  <path d="M 400 160 
           C 490 160, 590 195, 590 295 
           C 590 455, 480 575, 400 625 
           C 320 575, 210 455, 210 295 
           C 210 195, 310 160, 400 160 Z" 
        fill="#0D0E12" 
        stroke="url(#brandGradient)" 
        stroke-width="4" 
        opacity="0.9"/>

  <!-- VOO Quantum Ticker Emblem -->
  <g transform="translate(400, 370)">
    <!-- Pulse Ring -->
    <circle cx="0" cy="-30" r="85" fill="none" stroke="#E50914" stroke-width="3" opacity="0.6"/>
    <circle cx="0" cy="-30" r="115" fill="none" stroke="#1877F2" stroke-width="2" stroke-dasharray="6 6" opacity="0.8"/>

    <!-- VOO Text -->
    <text x="0" y="-10" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-weight="900" 
          font-size="76" 
          fill="#FFFFFF" 
          text-anchor="middle" 
          letter-spacing="6" 
          filter="url(#glow)">VOO</text>

    <!-- SENTINEL Subtext -->
    <text x="0" y="45" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-weight="700" 
          font-size="22" 
          fill="url(#brandGradient)" 
          text-anchor="middle" 
          letter-spacing="10">SENTINEL-4050</text>
  </g>

  <!-- Anomaly Sentinel Lock Indicator Dots -->
  <circle cx="400" cy="190" r="8" fill="#E50914"/>
  <circle cx="400" cy="600" r="8" fill="#1877F2"/>
</svg>